apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usuarios-db
  template:
    metadata:
      labels:
        app: usuarios-db
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - name: POSTGRES_DB
          value: usuarios_db
        - name: POSTGRES_USER
          value: usuarios_user
        - name: POSTGRES_PASSWORD
          value: usuarios123
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: usuarios-db
spec:
  ports:
  - port: 5432
  selector:
    app: usuarios-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usuarios-app
  template:
    metadata:
      labels:
        app: usuarios-app
    spec:
      containers:
      - name: usuarios
        image: usuarios-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: DB_HOST
          value: usuarios-db
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: usuarios_db
        - name: DB_USER
          value: usuarios_user
        - name: DB_PASSWORD
          value: usuarios123
---
apiVersion: v1
kind: Service
metadata:
  name: usuarios
spec:
  type: NodePort
  ports:
  - port: 3001
    targetPort: 3001
    nodePort: 30001
  selector:
    app: usuarios-app
