apiVersion: apps/v1
kind: Deployment
metadata:
  name: productos-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productos-db
  template:
    metadata:
      labels:
        app: productos-db
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - name: POSTGRES_DB
          value: productos_db
        - name: POSTGRES_USER
          value: productos_user
        - name: POSTGRES_PASSWORD
          value: productos123
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: productos-db
spec:
  ports:
  - port: 5432
  selector:
    app: productos-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productos-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: productos-app
  template:
    metadata:
      labels:
        app: productos-app
    spec:
      containers:
      - name: productos
        image: productos-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3002
        env:
        - name: PORT
          value: "3002"
        - name: DB_HOST
          value: productos-db
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: productos_db
        - name: DB_USER
          value: productos_user
        - name: DB_PASSWORD
          value: productos123
---
apiVersion: v1
kind: Service
metadata:
  name: productos
spec:
  type: NodePort
  ports:
  - port: 3002
    targetPort: 3002
    nodePort: 30002
  selector:
    app: productos-app
